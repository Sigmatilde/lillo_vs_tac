<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platformer Boss Fight - COTOLETTINE</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #87CEEB; 
            overflow: hidden;
            font-family: sans-serif;
        }
        canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* --- THE NEW HTML OVERLAY --- */
        #intro-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* This loads your image perfectly every time */
            background-image: url('cover.png'); 
            background-size: cover;
            background-position: center;
            background-color: #000; /* Fallback color */
            z-index: 9999; /* Keeps it on top of the game canvas */
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Pushes button to the bottom */
            padding-bottom: 10vh; /* Space from the bottom edge */
        }

        #start-btn {
            font-size: 36px;
            padding: 15px 50px;
            background-color: #ffcc00;
            color: #000;
            border: 4px solid #000;
            border-radius: 12px;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: bold;
            box-shadow: 0px 8px 0px #000;
            transition: all 0.1s;
        }

        #start-btn:hover {
            background-color: #ffff66;
            transform: translateY(4px);
            box-shadow: 0px 4px 0px #000;
        }
    </style>
</head>

+szXb29u/enPvv/zm7x8fL/u2Takn4mGuB2yAUYOshO7mAEfzFhxYqOsyE676UjNvb2+9+MY7L7/+hw/NZhcu7nz5KxeP7sz/8k//78lytVz1DgFJxuNxKXkzq6r5dOLY0d29gAOxMAuJILqpuyki+Ok2SAgRkGiT+c2l73Pbd4uD9nu/9o3945OSUt8nzWZewN3MCFCHIwAAAnRywNR3TJyyMzOhTcbju6v+W7/zf69euzOq667TW3cPX3zlndW61wJIgUKUgJUEs+I+DJQnRkCkU9pomwlyJCABYgcEU7ANKCAEdzvFyzy0IRFQ6qoy96OT5a07B4jadb2rgRuoETMSFVUbrr8ZuCM5E3R9appKRErq43j0xsdH/+tPf9Cu+sl4rKrHJwtAwoFmB0YM94CgD2SqJHRDYdiAFnNTc+dBr+KAxMOU1bDQwQaGTkzEiHQ6oez/D/CZ4JbEx1wGAAAAAElFTkSuQmCC";

        loadSprite("boss-img", "data:image/png;base64," + bossBase64);

        let playerName = "";
        let score = 0;

        function finishGame(won) {
            if (won) {
                score += 300;
            }
            let ranking = [];
            try {
                const stored = localStorage.getItem("ranking");
                if (stored) {
                    ranking = JSON.parse(stored);
                    if (!Array.isArray(ranking)) ranking = [];
                }
            } catch (e) {
                ranking = [];
            }
            ranking.push({ name: playerName, score: score });
            ranking.sort((a, b) => b.score - a.score);
            try {
                localStorage.setItem("ranking", JSON.stringify(ranking));
            } catch (e) {
            }
            go("ranking");
        }

        // --- THE MAGIC JAVASCRIPT FUNCTION ---
        // This hides your HTML image overlay and starts the game
        function startKaboomGame() {
            document.getElementById('intro-screen').style.display = 'none';
            go("start"); // Move from the waiting room to the name entry
            document.querySelector('canvas').focus(); // Make sure keyboard works
        }

        // --- SCENES ---

        // A blank waiting room for Kaboom while the HTML image covers the screen
        scene("wait", () => {});

        scene("start", () => {
            let entered = "";
            const prompt = add([
                text("Enter your name:", { size: 32, width: width() - 40, align: "center" }),
                pos(width() / 2, height() / 3),
                anchor("center"),
                fixed(),
            ]);
            const nameDisplay = add([
                text(entered, { size: 24, width: width() - 40, align: "center" }),
                pos(width() / 2, height() / 2),
                anchor("center"),
                fixed(),
            ]);
            add([
                text("Type and press Enter to start", { size: 16, width: width() - 40, align: "center" }),
                pos(width() / 2, height() * 2 / 3),
                anchor("center"),
                fixed(),
            ]);

            onCharInput((ch) => {
                entered += ch;
                nameDisplay.text = entered;
            });
            onKeyPress("backspace", () => {
                entered = entered.slice(0, -1);
                nameDisplay.text = entered;
            });
            onKeyPress("enter", () => {
                playerName = entered.trim() || "Player";
                go("game", { level: 1 });
            });
        });

        scene("ranking", () => {
            setGravity(0);
            const header = add([
                text("Ranking", { size: 32, align: "center", width: width() - 40 }),
                pos(width() / 2, 40),
                anchor("center"),
                fixed(),
            ]);
            let ranking = [];
            try {
                const stored = localStorage.getItem("ranking");
                if (stored) {
                    ranking = JSON.parse(stored);
                    if (!Array.isArray(ranking)) ranking = [];
                }
            } catch (e) {
                ranking = [];
            }
            const maxDisplay = 10;
            ranking.slice(0, maxDisplay).forEach((entry, idx) => {
                add([
                    text(`${idx + 1}. ${entry.name}: ${entry.score}`, { size: 24, align: "center", width: width() - 40 }),
                    pos(width() / 2, 80 + idx * 30),
                    anchor("center"),
                    fixed(),
                ]);
            });
            add([
                text("Press Enter to play again", { size: 16, align: "center", width: width() - 40 }),
                pos(width() / 2, height() - 60),
                anchor("center"),
                fixed(),
            ]);
            onKeyPress("enter", () => {
                // If they want to play again, go right back to the name entry
                go("start"); 
            });
        });

        scene("game", ({ level }) => {
            if (level === 1) {
                score = 0;
            }

            const scoreText = add([
                text(`Score: ${score}`, { size: 20 }),
                pos(10, 10),
                fixed(),
                z(100),
            ]);
            
            const levelText = add([
                text(`Level: ${level}`, { size: 20 }),
                pos(10, 40),
                fixed(),
                z(100),
            ]);

            const scoreTimer = loop(1, () => {
                score++;
                scoreText.text = `Score: ${score}`;
            });
            
            setGravity(1200);

            const floorHeight = 40;
            add([
                rect(width(), floorHeight),
                pos(0, height() - floorHeight),
                area(),
                body({ isStatic: true }),
                color(0, 180, 0),
                z(-1),
            ]);

            const platforms = [
                { w: 180, h: 20, x: 140, y: 320 },
                { w: 150, h: 20, x: 380, y: 250 },
            ];
            platforms.forEach(({ w, h, x, y }) => {
                add([
                    rect(w, h),
                    pos(x, y),
                    area(),
                    body({ isStatic: true }),
                    color(0, 150, 0),
                    z(-1),
                ]);
            });

            const bossPlatformWidth = 200;
            const bossPlatformHeight = 20;
            const bossPlatformX = width() - bossPlatformWidth - 40;
            const bossPlatformY = 180;
            add([
                rect(bossPlatformWidth, bossPlatformHeight),
                pos(bossPlatformX, bossPlatformY),
                area(),
                body({ isStatic: true }),
                color(0, 130, 0),
                z(-1),
            ]);

            const PLAYER_SPEED = 200;
            const JUMP_FORCE = 500;

            const player = add([
                text("🦖", { size: 32 }),
                pos(60, height() - floorHeight - 60),
                area(),
                anchor("center"),
                body(),
                scale(-1, 1),
                color(0, 0, 255), 
                "player",
            ]);

            const boss = add([
                sprite("boss-img"),
                pos(bossPlatformX + bossPlatformWidth / 2, bossPlatformY - 10),
                area(),
                anchor("center"),
                body({ isStatic: true }),
                scale(0.5),
                "boss",
            ]);

            boss.onUpdate(() => {
                boss.scale.x = player.pos.x < boss.pos.x ? -Math.abs(boss.scale.x) : Math.abs(boss.scale.x);
            });

            function spawnCotolette() {
                const horizontalSpeed = rand(80, 160);
                const verticalForce = rand(300, 500);
                const coto = add([
                    text("🥩", { size: 24 }),
                    pos(boss.pos.x - 20, boss.pos.y),
                    area(),
                    anchor("center"),
                    body(),
                    move(vec2(-1, 0), horizontalSpeed),
                    offscreen({ destroy: true }),
                    "cotolette",
                ]);
                coto.jump(verticalForce);
            }

            let spawnRate = 5;
            if (level === 2) spawnRate = 3;
            if (level === 3) spawnRate = 1.5;

            loop(spawnRate, () => {
                spawnCotolette();
            });

            onKeyDown("left", () => {
                player.move(-PLAYER_SPEED, 0);
            });
            onKeyDown("right", () => {
                player.move(PLAYER_SPEED, 0);
            });

            onKeyPress("space", () => {
                if (player.isGrounded()) {
                    player.jump(JUMP_FORCE);
                }
            });

            player.onCollide("cotolette", (coto) => {
                destroy(player);
                destroyAll("cotolette");
                add([
                    text("COTOLETTINE!", {
                        size: 48,
                    }),
                    color(255, 0, 0),
                    pos(width() / 2, height() / 2),
                    anchor("center"),
                    fixed(),
                    z(100),
                ]);
                wait(2, () => {
                    finishGame(false);
                });
            });

            player.onCollide("boss", (b) => {
                if (player.pos.y < b.pos.y) {
                    destroy(b);
                    destroyAll("cotolette");
                    destroy(player);
                    
                    if (level < 3) {
                        add([
                            text(`LEVEL ${level} COMPLETE!`, {
                                size: 32,
                                align: "center",
                                width: width() - 40,
                            }),
                            color(0, 128, 0),
                            pos(width() / 2, height() / 2),
                            anchor("center"),
                            fixed(),
                            z(100),
                        ]);
                        wait(3, () => {
                            go("game", { level: level + 1 });
                        });
                    } else {
                        add([
                            text(
                                "YOU WON! CONGRATS YOU WERE FASTER THAN LILLO'S COTOLETTINE,\nWITH SUCH A SPEED YOU CAN RUN A MARATHON IN UNDER 3 HOURS",
                                {
                                    size: 32,
                                    align: "center",
                                    width: width() - 40,
                                    lineSpacing: 4,
                                },
                            ),
                            color(0, 128, 0),
                            pos(width() / 2, height() / 2),
                            anchor("center"),
                            fixed(),
                            z(100),
                        ]);
                        wait(3, () => {
                            finishGame(true);
                        });
                    }
                }
            });
        });

        onLoad(() => {
            // Sit in the waiting room behind the HTML image until the button is clicked!
            go("wait"); 
        });
    </script>
